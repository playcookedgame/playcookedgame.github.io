<script id="cfg">
const CFG={
 demo:false, // true = purchases and ads are simulated (preview only). Set false in production.

<script id="wpdata">
// Cooked whitepaper content. Pure data, no DOM, so the game and a Markdown export share it.
// All token numbers are computed from CFG.token, so they can never disagree with each other.
function buildWhitepaper(CFG) {
  var TK = CFG.token;
  var n = function (x) {
    return Math.round(x).toLocaleString('en-US');
  };
  var m = function (x) {
    return (x / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M';
  };

  // ---- token model ---------------------------------------------------------------------
  var S = TK.supply;
  var dev = (S * TK.developer) / 100;
  var inv = (S * TK.investors) / 100;
  var com = (S * TK.players) / 100;
  var liq = S * 0.08; // launch liquidity (part of the players and community share)
  var camp = S * 0.04; // community campaigns and airdrops
  var rew = com - liq - camp; // play-to-earn rewards, emitted over five years
  var W = [100, 90, 70, 55, 45];
  var WS = W.reduce(function (a, b) {
    return a + b;
  }, 0);
  var emit = W.map(function (w) {
    return (rew * w) / WS;
  });
  var clamp = function (x) {
    return Math.max(0, Math.min(1, x));
  };
  function circ(mo) {
    var r = 0;
    for (var y = 0; y < 5; y++) r += emit[y] * clamp((mo - 12 * y) / 12);
    return {
      developer: dev * clamp((mo - 12) / 36),
      investors: inv * clamp((mo - 6) / 24),
      liquidity: liq,
      campaigns: camp * 0.5 + camp * 0.5 * clamp(mo / 12),
      rewards: r,
      total: 0,
    };
  }
  function circTotal(mo) {
    var c = circ(mo);
    return c.developer + c.investors + c.liquidity + c.campaigns + c.rewards;
  }
  var MS = [0, 6, 12, 24, 36, 48, 60];
  var pct = function (x) {
    return (x / S) * 100;
  };
  var p1 = function (x) {
    return x.toFixed(1).replace(/\.0$/, '') + '%';
  };
  var monthlyY1 = emit[0] / 12;
  var capPerPlayer = monthlyY1 * 0.001;

  var site = CFG.site ? CFG.site.replace(/^https?:\/\//, '') : 'cooked.app';
  var sym = '$' + TK.symbol;

  var sections = [];
  function sec(id, title, blocks) {
    sections.push({ id: id, title: title, blocks: blocks });
  }
  var P = function (x) {
    return { t: 'p', x: x };
  };
  var H = function (x) {
    return { t: 'h3', x: x };
  };
  var UL = function (items) {
    return { t: 'ul', items: items };
  };
  var NOTE = function (x, kind) {
    return { t: 'note', x: x, kind: kind || 'info' };
  };

  sec('summary', 'Summary', [
    P(
      'Cooked is a free-to-play game that runs in your browser. It is about surviving the daily problems of real life: the alarm that did not ring, a phone at 1%, traffic, rent, the message that was seen and never answered. You dodge life\'s problems, catch what cools you down, and see how long you can last.',
    ),
    P(
      'The ' + sym + ' token is the planned on-chain currency of the Cooked world. People who play fairly and consistently earn it through seasonal rewards. Holders can use it for premium cosmetics and season passes, and can vote on new levels, problems and sponsors.',
    ),
    { t: 'kv', rows: [
      ['Token', TK.name + ' (' + sym + ')'],
      ['Total supply', n(S) + ', fixed. No new tokens can be created after launch.'],
      ['Players and community', TK.players + '% (' + n(com) + ')'],
      ['Investors', TK.investors + '% (' + n(inv) + ')'],
      ['Developer', TK.developer + '% (' + n(dev) + ')'],
      ['Network', 'Solana'],
      ['Official sponsor', 'Solana'],
      ['Partners', 'Bitget and KuCoin'],
      ['Official website', site + ' (planned)'],
      ['Status', 'Pre-launch. A 6-month plan. The token is not live.'],
    ] },
    NOTE('Fun comes first. Cooked is a game before it is anything else.', 'info'),
  ]);

  sec('why', 'Why Cooked', [
    P('Everyone knows the feeling of a day where small problems stack up faster than you can clear them. Games about that feeling are instantly understood, instantly shared, and instantly funny, because they are about us.'),
    UL([
      'Relatable. The problems in Cooked are the ones people actually face: exams, rent, a dead battery, a weak signal, a boss who wants a call, family asking when you are getting married.',
      'Easy to reach. It opens from a link in any phone browser. No download, no app store, no account to create.',
      'Easy to share. Your result is one number and a picture that fits a group chat.',
      'Proven appetite. Recent browser games built around everyday life reportedly drew millions of players within days of launch.',
    ]),
    H('What we do differently from most token games'),
    P('Many earlier token games paid early players with money from later players, were overrun by bots, and collapsed when new buyers stopped arriving. Cooked is designed the other way round:'),

      'Anti-bot and anti-abuse controls are part of the design from day one, and the server, not the browser, decides who earned what.',
    ]),
  ]);

  sec('game', 'The game', [
    P('You are a glowing orb. Life problems fall toward you. Drag to dodge them and catch the things that cool you down. Your stress bar rises on its own and with every hit. At 100% you are cooked.'),

      'Endless levels, unlocked by total coins. Level 1 starts at the 5,000 starter coins and every next level needs more total coins than the last. Student life, Job hunt, Adulting, Family & love, Parenting, Career climb, Building a home, Caring for parents, Planning ahead, then Life, Chapter 1, 2, 3 and so on forever.',
      'Problems with weight. More than 70 everyday problems, each with a severity. Rent and hospital bills hurt more than a weak network.',

  sec('economy', 'Two-layer economy', [

      ['How you get it', 'Playing: you earn coins by surviving, dodging problems and catching cooling items, and lose coins every time a problem hits', 'Seasonal rewards for verified fair play'],
      ['What it buys', 'Shop items, revives, boosts', 'Premium cosmetics, season passes, votes'],

    { t: 'table', head: ['Level', 'Stage', 'Total coins needed'], rows: levelRows },
    P('After that the stages continue as Life, Chapter 2, 3 and so on, each one needing more total coins than the last, with no finish line.'),
  ]);

  sec('earn', 'How players earn ' + sym, [
    P('Rewards are paid in seasons, one per month. The size of each season\'s pool is fixed by the emission schedule below, no matter how many people play. More players means a smaller slice each, never more tokens.'),
    UL([
      'Each season has a fixed pool of ' + sym + ' taken from the play rewards allocation.',

  var allocRows = [
    ['Players and community', TK.players + '%', n(com), 'Rewards, liquidity and campaigns (see below)'],
    ['Investors', TK.investors + '%', n(inv), '6-month cliff, then 24 months linear'],

  var commRows = [
    ['Play rewards (seasons)', p1(pct(rew)), n(rew), 'Emitted over 5 years on a declining schedule'],

  var circRows = MS.map(function (mo) {
    var c = circTotal(mo);
    return [mo === 0 ? 'Launch' : 'Month ' + mo, n(c), p1(pct(c))];
  });

  sec('tokenomics', 'Tokenomics', [
    P('Total supply is ' + n(S) + ' ' + sym + '. It is created once, at launch, and the mint authority is permanently revoked, so no more can ever be created. The developer holds only ' + TK.developer + '%.'),
    { t: 'chart', kind: 'alloc', data: { players: TK.players, investors: TK.investors, developer: TK.developer } },

    { t: 'table', head: ['Group', 'Share', 'Tokens', 'Release'], rows: allocRows },

    { t: 'chart', kind: 'circ', data: { pts: (function () { var a = []; for (var i = 0; i <= 60; i += 1) a.push([i, pct(circTotal(i))]); return a; })() } },
    { t: 'table', head: ['When', 'Circulating', '% of supply'], rows: circRows },
    H('Safeguards'),
    UL([

      'Admin keys are held in a multi-signature wallet with a time delay on changes.',

  sec('utility', 'Token utility and sinks', [
    H('What ' + sym + ' is for'),
    UL([
      'Premium cosmetics and seasonal orb looks.',
      'Season passes with extra cosmetic rewards.',
      'Voting on new levels, life problems and sponsor categories.',
      'Early access to new worlds and features.',

function wpBlock(b){if(b.t==='p')return `<p>${wEsc(b.x)}</p>`;if(b.t==='h3')return `<h3>${wEsc(b.x)}</h3>`;
if(b.t==='ul')return `<ul>${b.items.map(i=>`<li>${wEsc(i)}</li>`).join('')}</ul>`;
if(b.t==='note')return `<div class="wn ${b.kind}">${wEsc(b.x)}</div>`;
if(b.t==='kv')return `<dl class="wkv">${b.rows.map(r=>`<div><dt>${wEsc(r[0])}</dt><dd>${wEsc(r[1])}</dd></div>`).join('')}</dl>`;
if(b.t==='table')return `<div class="wt"><table><thead><tr>${b.head.map(h=>`<th>${wEsc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr class="${/^(Total|Subtotal)$/.test(r[0])?'tot':''}">${r.map(c=>`<td>${wEsc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
if(b.t==='chart')return wpChart(b);return ''}
function openWP(id){if(!wpDoc){wpDoc=buildWhitepaper(CFG);
$('wpn').innerHTML=wpDoc.sections.map(x=>`<button class="alt" data-s="${x.id}">${wEsc(x.title)}</button>`).join('');
$('wpc').innerHTML=`<div class="cover"><h1>${wEsc(wpDoc.title)}</h1><p>${wEsc(wpDoc.subtitle)}</p></div>`+wpDoc.sections.map(x=>`<section id="wps-${x.id}"><h2>${wEsc(x.title)}</h2>${x.blocks.map(wpBlock).join('')}</section>`).join('')+`<p class="small" style="text-align:center">End of whitepaper v${wEsc(wpDoc.version)}.</p>`;
$('wpn').onclick=e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const el=document.getElementById('wps-'+b.dataset.s);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
$('wp').onscroll=()=>{const el=$('wp'),h=el.scrollHeight-el.clientHeight;$('wpp').style.width=(h>0?el.scrollTop/h*100:0)+'%'};
$('wpb').onclick=closeWP}
wpOpen=true;$('wp').classList.remove('hide');$('wp').scrollTop=0;
if(id)setTimeout(()=>{const el=document.getElementById('wps-'+id);if(el)el.scrollIntoView()},40)}
function closeWP(){wpOpen=false;$('wp').classList.add('hide')}
</script></body></html>
