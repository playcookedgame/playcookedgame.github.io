name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cooked.p12"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cooked.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: cooked
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleRelease > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          tail -n 25 "$RUNNER_TEMP/build.log"
          if [ $code -ne 0 ]; then
            SUMMARY=$(grep -i -A14 'what went wrong' "$RUNNER_TEMP/build.log" | head -n 50)
            [ -z "$SUMMARY" ] && SUMMARY=$(tail -n 50 "$RUNNER_TEMP/build.log")
            SUMMARY=$(printf '%s' "$SUMMARY" | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$SUMMARY"
            exit $code
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Cooked.apk
          gh release create "app-v1.${{ github.run_number }}" Cooked.apk \
            --title "Cooked app 1.${{ github.run_number }}" \
            --notes "Install on Android: download Cooked.apk and open it. The app always loads the latest version of the game." \
            --latest
